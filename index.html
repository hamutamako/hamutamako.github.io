  els.chipRow.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    if(chip.dataset.sort){
      currentSort = (currentSort === chip.dataset.sort) ? null : chip.dataset.sort;
      els.chipRow.querySelectorAll(".chip.sort").forEach(function(s){
        s.classList.toggle("active", s.dataset.sort === currentSort);
      });
    } else {
      var f = chip.dataset.filter;
      filters[f] = !filters[f];
      chip.classList.toggle("active", filters[f]);
    }
    render();
  });
  els.search.addEventListener("input", render);

  els.themeToggle.addEventListener("click", function(){
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effectiveDark = cur ? cur === "dark" : prefersDark;
    root.setAttribute("data-theme", effectiveDark ? "light" : "dark");
  });

  // 🔄最新版を取得：タブを閉じ直さなくても最新のファイルを取りに行けるように。
  // location.reload()だけだとキャッシュが効いて古いまま、ということがあったため、
  // URLにキャッシュ避け用のクエリを付けて確実にサーバーへ新規リクエストさせる（ユーザー要望2026-08-23）
  els.reloadBtn.addEventListener("click", function(){
    var base = location.href.split("?")[0].split("#")[0];
    location.href = base + "?_r=" + Date.now();
  });

  els.exportBtn.addEventListener("click", function(){
    var pad = function(n){ return String(n).padStart(2,"0"); };
    var d = new Date();
    var filename = APP.name + "_バックアップ_" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json";
    var data = JSON.stringify(buildBackup(), null, 2);
    var originalLabel = els.exportBtn.textContent;
    function done(){
      markBackedUp();
      renderDiag();
      els.exportBtn.textContent = "✅";
      setTimeout(function(){ els.exportBtn.textContent = originalLabel; }, 1500);
    }
    // Artifactの表示枠の中では専用の保存機能（window.claude.downloads）を使う
    if(window.claude && window.claude.downloads){
      window.claude.downloads.save({filename: filename, data: data}).then(done).catch(function(err){
        if(err && err.code === "declined") return;
        alert("保存に失敗しました: " + (err && err.message ? err.message : "不明なエラー"));
      });
      return;
    }
    // GitHub Pagesなどふつうのブラウザでは、標準のダウンロードで保存する
    // （iPhoneのSafariでは「ダウンロード」に入る。ファイルAppの「ダウンロード」フォルダから取り出せる）
    try{
      var blob = new Blob([data], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      done();
    }catch(err2){
      alert("保存に失敗しました: " + (err2 && err2.message ? err2.message : "不明なエラー"));
    }
  });

  els.importBtn.addEventListener("click", function(){
    els.importFile.value = "";
    els.importFile.click();
  });

  els.importFile.addEventListener("change", function(){
    var file = els.importFile.files && els.importFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var imported;
      try{
        imported = JSON.parse(reader.result);
      }catch(e){
        alert("読み込みに失敗しました。正しいファイルか確認してください。");
        return;
      }
      // 上書きは取り消せないので、何を読み込むのか見せてから確認する
      var when = (imported && imported.savedAt) ? imported.savedAt + " に書き出したもの" : "書き出した日時が記録されていないファイル";
      if(!confirm(when + "を読み込みます。\n\n今アプリに入っているデータは上書きされます。よろしいですか？")) return;

      var r = applyBackup(imported);
      if(!r.ok){
        alert("読み込みに失敗しました。正しいファイルか確認してください。");
        return;
      }
      // localStorage を書き換えたので、画面の側も読み直す
      state = loadState();
      simState = loadSimState();
      homeState = loadHomeState();
      render();
      if(activeCollection === "home") renderHome();
      if(simMode) renderSim();
      renderDiag();
      alert(r.legacy
        ? "古い形式のファイルを読み込みました。（銀行の記録のみ）"
        : "読み込みました。（" + r.count + "種類のデータ）");
    };
    reader.readAsText(file);
  });

  function passesFilters(bank){
    for(var i=0;i<BADGE_DEF.length;i++){
      var k = BADGE_DEF[i].key;
      if(filters[k] && bank.services[k] !== "yes") return false;
    }
    if(filters.foil && bank.rateMax < 0.5) return false;
    if(filters.owned && !getEntry(bank.code).owned) return false;
    return true;
  }
  function matchesSearch(bank, q){
    if(!q) return true;
    q = q.trim().toLowerCase();
    return bank.name.toLowerCase().indexOf(q) !== -1 || bank.code.indexOf(q) !== -1;
  }

  function debitRateDisplay(bank){
    if(bank.debit.rate) return bank.debit.rate;
    if(bank.debit.name.indexOf("発行不可") !== -1) return "発行不可";
    if(bank.debit.name.indexOf("発行有無不明") !== -1) return "不明";
    return "非公開";
  }
  function debitRateSortValue(bank){
    // "%"が直後に続く数値だけを拾う(例："廃止(2025年10月末)"の2025や、
    // "0.6%(1テックま君)"の1のような、還元率ではない数字を誤って拾わないため)
    var nums = (bank.debit.rate || "").match(/\d+(\.\d+)?(?=\s*%)/g);
    if(!nums) return -1;
    return Math.max.apply(null, nums.map(Number));
  }
  function pointTotalSortValue(bank){
    var entry = getEntry(bank.code);
    var fixedSum = computePointTotal(bank, entry).reduce(function(sum, t){ return sum + t.total; }, 0);
    return fixedSum + computeDebitAmount(bank, entry);
  }

  function numsHtml(list, emptyLabel){
    return list.length
      ? '<div class="poikatsu-nums">' + list.map(function(t){ return '<div class="poikatsu-num">' + t.total.toLocaleString() + '<span class="poikatsu-unit">' + t.unit + '</span></div>'; }).join("") + '</div>'
      : '<div class="poikatsu-nums"><div class="poikatsu-num poikatsu-num-zero">0<span class="poikatsu-unit">' + emptyLabel + '</span></div></div>';
  }

  function renderDebitCalc(bank, entry){
    var rate = effectiveDebitRate(bank, entry);
    if(rate === null){
      return '<p class="debit-calc-note">この行はデビット還元率が非公開・制度なしのため％還元の計算対象外です。</p>';
    }
    var debitAmt = computeDebitAmount(bank, entry);
    return '' +
    '<div class="debit-calc">' +
      '<div class="debit-calc-row"><span>月のデビット利用予定額</span><span>' +
        '<input type="number" inputmode="decimal" min="0" step="1000" data-debit-spend data-code="' + bank.code + '" value="' + (entry.debitSpend ? entry.debitSpend : '') + '" placeholder="0">円' +
      '</span></div>' +
      '<div class="debit-calc-row"><span>適用する還元率</span><span>' +
        '<input type="number" inputmode="decimal" min="0" step="0.01" data-debit-rate data-code="' + bank.code + '" value="' + rate + '">%' +
      '</span></div>' +
      '<div class="debit-calc-result">見込み：<b>' + debitAmt.toLocaleString() + '</b>円相当/月</div>' +
    '</div>';
  }

  function computeScheduleDates(item, sel){
    var sc = item.schedule;
    if(!sel || !sel.day) return null;
    if(sc.kind === "nyukin"){
      var withdraw = nextMonthlyDate(sel.day);
      var arrive = addBusinessDays(withdraw, sc.arrivalOffsetDays);
      return {stages:[
        {label:"引落日", date:withdraw},
        {label:"入金予定", date:arrive}
      ]};
    }
    if(sc.kind === "furikomi"){
      var exec = nextMonthlyDate(sel.day);
      if(isWeekend(exec)) exec = shiftForWeekend(exec, sel.holiday || "翌営業日");
      return {stages:[
        {label:"実行予定日", date:exec}
      ]};
    }
    return null;
  }
  function scheduleRowTotal(row, item){
    var amount = (row && row.amount) || item.reqAmount || 0;
    var count = (row && row.count) || 1;
    return amount * count;
  }

  function renderScheduleControl(code, idx, item, entry){
    var sc = item.schedule;
    if(sc.kind === "received") return renderReceivedRows(code, idx, item, entry);
    var sel = entry.sched[idx] || {};
    var inputHtml = "";
    if(sc.kind === "nyukin"){
      inputHtml = sc.choices.map(function(d){
        var checked = sel.day === d;
        return '<label class="sched-radio"><input type="radio" name="sched-' + code + '-' + idx + '" data-sched-day data-code="' + code + '" data-idx="' + idx + '" value="' + d + '"' + (checked ? ' checked' : '') + '>' + d + '日</label>';
      }).join("") +
      '<select class="sched-select sched-source-select" data-sched-source data-code="' + code + '" data-idx="' + idx + '">' +
        '<option value="">引落元(送金元)の口座を選択</option>' +
        DATA.filter(function(b){ return b.code !== code; }).map(function(b){
          return '<option value="' + b.code + '"' + (sel.sourceCode === b.code ? ' selected' : '') + '>' + b.name + '</option>';
        }).join("") +
      '</select>';
    } else if(sc.kind === "furikomi"){
      inputHtml =
        '<input class="sched-day-input" type="number" inputmode="numeric" min="' + sc.minDay + '" max="' + sc.maxDay + '" data-sched-freeday data-code="' + code + '" data-idx="' + idx + '" value="' + (sel.day || "") + '" placeholder="日">日' +
        '<select class="sched-holiday-select" data-sched-holiday data-code="' + code + '" data-idx="' + idx + '">' +
          '<option value="翌営業日"' + (sel.holiday !== "前営業日" ? ' selected' : '') + '>休日なら翌営業日</option>' +
          '<option value="前営業日"' + (sel.holiday === "前営業日" ? ' selected' : '') + '>休日なら前営業日</option>' +
        '</select>' +
        '<select class="sched-select sched-source-select" data-sched-target data-code="' + code + '" data-idx="' + idx + '">' +
          '<option value="">振込先の口座を選択</option>' +
          DATA.filter(function(b){ return b.code !== code; }).map(function(b){
            return '<option value="' + b.code + '"' + (sel.targetCode === b.code ? ' selected' : '') + '>' + b.name + '</option>';
          }).join("") +
        '</select>' +
        (sel.day ? '<input class="sched-day-input sched-amt-input" type="number" inputmode="numeric" min="0" step="1000" data-sched-amount data-code="' + code + '" data-idx="' + idx + '" value="' + (sel.amount || "") + '" placeholder="金額">円' : '');
    }
    var result = computeScheduleDates(item, sel);
    var resultHtml = result
      ? '<div class="sched-timeline">' + result.stages.map(function(s, i){
          return (i > 0 ? '<span class="sched-arrow">→</span>' : '') +
            '<span class="sched-dot"></span><span class="sched-stage-label">' + s.label + ' ' + formatDate(s.date) + '</span>';
        }).join("") + '</div>'
      : '<div class="sched-hint">日付を選択すると次回の予定日が表示されます</div>';
    return '' +
      '<div class="sched-box">' +
        '<div class="sched-inputs">' + inputHtml + '</div>' +
        resultHtml +
        (sc.note ? '<div class="sched-note">' + sc.note + '</div>' : '') +
      '</div>';
  }

  function renderReceivedRows(code, idx, item, entry){
    var sc = item.schedule;
    var rows = getScheduleRows(entry, idx);
    var sourceBanks = DATA.filter(function(b){ return b.freeTransferMax > 0 && b.code !== code; })
      .map(function(b){ return {bank:b, effMax: effectiveFreeTransferMax(b, getEntry(b.code))}; })
      .sort(function(a, b){ return b.effMax - a.effMax; });
    var totalCount = 0;
    var fullTotal = rows.reduce(function(s, r){ return s + (r.count || 1); }, 0);
    var rowsHtml = rows.map(function(row, rowIdx){
      totalCount += row.count || 1;
      var srcBank = row.sourceCode ? DATA.filter(function(b){ return b.code === row.sourceCode; })[0] : null;
      var srcEffMax = srcBank ? effectiveFreeTransferMax(srcBank, getEntry(srcBank.code)) : 0;
      var dateStage = row.day ? {label:"振込予定日", date:nextMonthlyDate(row.day)} : null;
      var timelineHtml = dateStage
        ? '<div class="sched-timeline"><span class="sched-dot"></span><span class="sched-stage-label">' + dateStage.label + ' ' + formatDate(dateStage.date) + '</span></div>'
        : '';
      var rowWarnHtml = (srcBank && row.count && row.count > srcEffMax)
        ? '<div class="sched-warn">⚠ ' + srcBank.name + 'の無料枠(月' + srcEffMax + '回、現在のランク基準)を超えています</div>'
        : '';
      // 他の行が既に使っている回数分を除いた「残り」までしか選べないようにして、合計が上限を超える組み合わせを作りにくくする
      var otherTotal = fullTotal - (row.count || 1);
      var maxCount = sc.capCount ? Math.max(sc.capCount - otherTotal, row.count || 1) : Math.max(row.count || 1, 1);
      var countOptionsHtml = "";
      for(var n = 1; n <= maxCount; n++){
        countOptionsHtml += '<option value="' + n + '"' + ((row.count || 1) === n ? ' selected' : '') + '>' + n + '</option>';
      }
      return '' +
        '<div class="sched-row" data-row="' + rowIdx + '">' +
          '<div class="sched-inputs">' +
            '<select class="sched-select" data-mrow-source data-code="' + code + '" data-idx="' + idx + '" data-row="' + rowIdx + '">' +
              '<option value="">振込元を選択</option>' +
              sourceBanks.map(function(entry2){
                var b = entry2.bank;
                return '<option value="' + b.code + '"' + (row.sourceCode === b.code ? ' selected' : '') + '>' + b.name + '(月' + entry2.effMax + '回無料)</option>';
              }).join("") +
            '</select>' +
            '<input class="sched-day-input sched-amt-input" type="number" inputmode="numeric" min="0" step="1000" data-mrow-amount data-code="' + code + '" data-idx="' + idx + '" data-row="' + rowIdx + '" value="' + (row.amount || item.reqAmount) + '">円×' +
            '<select class="sched-select sched-count-select" data-mrow-count data-code="' + code + '" data-idx="' + idx + '" data-row="' + rowIdx + '">' + countOptionsHtml + '</select>回' +
            '<input class="sched-day-input" type="number" inputmode="numeric" min="1" max="31" data-mrow-day data-code="' + code + '" data-idx="' + idx + '" data-row="' + rowIdx + '" value="' + (row.day || "") + '" placeholder="日">日' +
            '<button type="button" class="sched-row-remove" data-mrow-remove data-code="' + code + '" data-idx="' + idx + '" data-row="' + rowIdx + '" title="この行を削除">✕</button>' +
          '</div>' +
          timelineHtml +
          rowWarnHtml +
        '</div>';
    }).join("");
    var capWarnHtml = (sc.capCount && totalCount > sc.capCount)
      ? '<div class="sched-warn">⚠ 合計' + totalCount + '回が上限(月' + sc.capCount + '回)を超えています</div>'
      : '';
    return '' +
      '<div class="sched-box">' +
        rowsHtml +
        '<button type="button" class="sched-add-row" data-mrow-add data-code="' + code + '" data-idx="' + idx + '">＋ 振込元を追加</button>' +
        (sc.capCount ? '<div class="sched-hint">合計' + totalCount + '回 / 上限' + sc.capCount + '回</div>' : '') +
        capWarnHtml +
        (sc.note ? '<div class="sched-note">' + sc.note + '</div>' : '') +
      '</div>';
  }

  // 番号だけの直リンクはどこに飛ぶか分からず不便、かつ1つの項目に複数リンクが
  // 紐づくため「ラベルを押したら1件の詳細ページへ」という単純化もできないと判明。
  // ページ内の「情報源」一覧へジャンプする元の方式に戻す(2026-09-23ユーザー要望)。
  function srcMark(bank, key){
    var refs = bank.srcRefs && bank.srcRefs[key];
    if(!refs || !refs.length) return "";
    var links = refs.map(function(n){
      return '<button type="button" class="src-mark-link" data-jump-src="src-' + bank.code + '-' + n + '">' + n + '</button>';
    }).join(",");
    return '<sup class="src-mark">[' + links + ']</sup>';
  }
  function renderSources(bank){
    var list = bank.sources || [];
    if(!list.length) return "";
    var items = list.map(function(s){
      return '<li id="src-' + bank.code + '-' + s.n + '">[' + s.n + '] <a href="' + s.url + '" target="_blank" rel="noopener noreferrer">' + s.label + '</a></li>';
    }).join("");
    return '<div class="sect sources"><h3>情報源</h3><ol class="source-list">' + items + '</ol></div>';
  }
  function renderPointBox(bank, entry){
    var items = bank.pointItems || [];
    var fixedTotals = computePointTotal(bank, entry);
    var combinedTotals = computeCombinedTotals(bank, entry);
    // 定額自動振込・定額自動入金・被振込(schedule付き項目)は「実際にお金が動く一番重要な情報」として先頭に表示する。
    // 並べ替えは表示上のみで、data-idx等は元のpointItems配列のインデックスを保持したまま使う(entry.pts/entry.sched等の紐付けを崩さないため)。
    var order = items.map(function(item, idx){ return {item:item, idx:idx}; });
    order.sort(function(a, b){
      var aHas = a.item.schedule ? 1 : 0;
      var bHas = b.item.schedule ? 1 : 0;
      if(aHas !== bHas) return bHas - aHas;
      return a.idx - b.idx;
    });
    var listHtml = items.length
      ? '<ul class="poikatsu-list">' + order.map(function(pair){
          var item = pair.item, idx = pair.idx;
          var checked = !!entry.pts[idx];
          return '<li class="poikatsu-item' + (checked?' checked':'') + '">' +
            '<label>' +
              '<input type="checkbox" data-point-toggle data-code="' + bank.code + '" data-idx="' + idx + '"' + (checked?' checked':'') + '>' +
              '<span class="poikatsu-item-label">' + item.label + '</span>' +
              '<span class="poikatsu-item-val">+' + item.value.toLocaleString() + item.unit + '</span>' +
            '</label>' +
            (item.reqAmount || item.entryRequired ?
              '<div class="poikatsu-item-tags">' +
                (item.reqAmount ? '<span class="poikatsu-item-tag req">必要額 ' + item.reqAmount.toLocaleString() + '円(必要資金に計上)</span>' : '') +
                (item.entryRequired ? '<span class="poikatsu-item-tag entry">🔄 毎月エントリー必要</span>' : '') +
              '</div>' : '') +
            (item.note ? '<div class="poikatsu-item-note">' + item.note + '</div>' : '') +
            (item.schedule ? renderScheduleControl(bank.code, idx, item, entry) : '') +
          '</li>';
        }).join("") + '</ul>'
      : '<p class="poikatsu-empty">固定額でもらえるポイント条件は確認されていません(倍率型・利用額連動型、またはポイント制度自体がない場合を含む)。下記「ポイント制度」の説明を参照してください。</p>';
    return '' +
    '<div class="sect featured poikatsu">' +
      '<h3>★ ' + (bank.pointName || 'ポイ活情報') + '</h3>' +
      '<div class="poikatsu-group"><div class="poikatsu-group-label">固定ポイント小計</div>' + numsHtml(fixedTotals, "条件を選ぶと集計") + '</div>' +
      listHtml +
      '<div class="poikatsu-group"><div class="poikatsu-group-label">％還元小計(デビット利用)</div>' + renderDebitCalc(bank, entry) + '</div>' +
      '<div class="poikatsu-group total"><div class="poikatsu-group-label">合計(固定＋％還元)</div>' + numsHtml(combinedTotals, "まだ集計対象がありません") + '</div>' +
      '<p class="points-text debit-rate-line"><b>' + bank.debit.name + '</b><span class="debit-rate-big">' + debitRateDisplay(bank) + srcMark(bank,'debit') + '</span></p>' +
      '<p class="points-text">' + bank.debit.note + '</p>' +
      '<p class="points-text"><b>ポイント制度：</b>' + bank.points + srcMark(bank,'points') + '</p>' +
    '</div>';
  }

  // 他行のカードで「振込元」「引落元(送金元)」にこの銀行が指定されている項目を横断的に集める(この銀行から見た「出ていく」お金の一覧)。
  // データの入力元は常に相手側カードのまま(ここでは編集不可の参照表示のみ)にして、二重入力・二重管理を避ける。
  function getOutgoingLinks(sourceCode){
    var links = [];
    DATA.forEach(function(bank){
      if(bank.code === sourceCode) return;
      var entry = getEntry(bank.code);
      (bank.pointItems || []).forEach(function(item, idx){
        var sc = item.schedule;
        if(!sc) return;
        if(sc.kind === "received"){
          getScheduleRows(entry, idx).forEach(function(row){
            if(row.sourceCode === sourceCode){
              links.push({kind:"received", bank:bank, itemLabel:item.label,
                amount: row.amount || item.reqAmount, count: row.count || 1, day: row.day});
            }
          });
        } else if(sc.kind === "nyukin"){
          var sel = entry.sched[idx];
          if(sel && sel.sourceCode === sourceCode && sel.day){
            links.push({kind:"nyukin", bank:bank, itemLabel:item.label,
              day: sel.day, arrive: addBusinessDays(nextMonthlyDate(sel.day), sc.arrivalOffsetDays)});
          }
        }
      });
    });
    return links;
  }
  // furikomi(定額自動振込)は送金元(自分)のカードで「振込先」を選ぶ設計のため、逆方向(振込先の銀行のカードに「他行からの振込予定」として表示)の参照を集める
  function getIncomingLinks(destCode){
    var links = [];
    DATA.forEach(function(bank){
      if(bank.code === destCode) return;
      var entry = getEntry(bank.code);
      (bank.pointItems || []).forEach(function(item, idx){
        var sc = item.schedule;
        if(!sc || sc.kind !== "furikomi") return;
        var sel = entry.sched[idx];
        if(sel && sel.targetCode === destCode && sel.day){
          var exec = nextMonthlyDate(sel.day);
          if(isWeekend(exec)) exec = shiftForWeekend(exec, sel.holiday || "翌営業日");
          links.push({bank:bank, itemLabel:item.label, day:sel.day, exec:exec, amount:sel.amount});
        }
      });
    });
    return links;
  }
  function renderIncomingLinks(bank){
    var links = getIncomingLinks(bank.code);
    if(!links.length) return "";
    var items = links.map(function(l){
      return '<li><b>' + l.bank.name + '</b>：' + l.itemLabel + (l.amount ? '(' + l.amount.toLocaleString() + '円、' : '(') + '毎月' + l.day + '日実行予定 → ' + formatDate(l.exec) + ')</li>';
    }).join("");
    return '<div class="sect outgoing"><h3>🔀 他行からこの口座への振込予定(他カードで入力済み)</h3><ul class="outgoing-list">' + items + '</ul>' +

  // 🎯 残高の判定日（診断エンジンのbalanceJudgesと同じデータ源）。

  // チャージ元・チャージ先を、ポイント画面の電卓と同じく「リストから選ぶ→選んだものの

  function renderChargeSelect(card, entry, kind, items, label){
    if(!items || !items.length) return "";

  // ---------- チャージルート(入口／出口)の表示 (2026-09-24新設) ----------
  // CHARGE_ROUTESを「チャージ先から見た入口」「チャージ元から見た出口」の両方向で引けるようにする。
  var CHARGE_ST = {
    ok:{icon:"🟢", label:"通る＋ポイント付与"},
    zero:{icon:"🟡", label:"通るがポイント0%(経由用)"},
    ng:{icon:"🔴", label:"封鎖・不可"},
    unk:{icon:"⚪", label:"未確認・情報が食い違う"}
  };
  var CHARGE_ST_ORDER = {ok:0, unk:1, zero:2, ng:3};
  var CHARGE_LIST = (function(){
    var out = [];
    function arr(v){ return Array.isArray(v) ? v : [v]; }
    CHARGE_ROUTES.forEach(function(r){
      arr(r.f).forEach(function(f){
        arr(r.t).forEach(function(t){
          var o = {}; for(var k in r) o[k] = r[k];
          o.f = f; o.t = t;
          out.push(o);
        });
      });
    });
    return out;
  })();
  function chargeNodeName(code){
    for(var i=0;i<CARD_DATA.length;i++) if(CARD_DATA[i].code === code) return CARD_DATA[i].name;
    if(CHARGE_DEBIT_NAME[code]) return CHARGE_DEBIT_NAME[code];
    return code;
  }
  function todayYmd(){
    var d = new Date();
    return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
  }
  // 予告済みの改定(later)は、その日付を過ぎたら自動で改定後の状態に切り替える。
  function chargeView(r){
    var v = {st:r.st, off:r.off, pending:null};
    if(r.later){
      if(todayYmd() >= r.later.date){ v.st = r.later.st; v.off = r.later.off; }
      else { v.pending = r.later; }
    }
    return v;
  }
  function chargeRoutesFor(code, dir){
    var key = dir === "in" ? "t" : "f";
    return CHARGE_LIST.filter(function(r){ return r[key] === code; }).sort(function(a, b){
      return CHARGE_ST_ORDER[chargeView(a).st] - CHARGE_ST_ORDER[chargeView(b).st];
    });
  }
  function renderChargeRouteDetail(r, dir){
    var v = chargeView(r);
    var st = CHARGE_ST[v.st];
    var other = dir === "in" ? chargeNodeName(r.f) : chargeNodeName(r.t);
    var path = chargeNodeName(r.f) + ' → ' + chargeNodeName(r.t);
    var srcs = (r.src || []).map(function(k){
      var s = CHARGE_SRC[k];
      return s ? '<li><a href="' + s.url + '" target="_blank" rel="noopener noreferrer">' + s.label + '</a></li>' : '';
    }).join("");
    return '' +
      '<div class="route-detail">' +
        '<div class="route-path">' + path + '</div>' +
        '<div class="route-st st-' + v.st + '">' + st.icon + ' ' + st.label + '</div>' +
        '<dl class="route-dl">' +
          '<dt>公式</dt><dd>' + (v.off || '記載なし・未調査') + '</dd>' +
          '<dt>実践報告</dt><dd>' + (r.pr || '報告なし') + '</dd>' +
          (v.pending ? '<dt>予告</dt><dd class="route-warn">' + v.pending.date + 'から：' + CHARGE_ST[v.pending.st].icon + ' ' + v.pending.off + '</dd>' : '') +
          '<dt>最終確認</dt><dd>' + (r.chk || CHARGE_CHECKED) + '</dd>' +
        '</dl>' +
        (srcs ? '<details class="note-fold"><summary>出典</summary><ul class="route-src">' + srcs + '</ul></details>' : '') +
      '</div>';
  }
  // 入口・出口もポイント画面の電卓と同じ「リストから選ぶ→選んだものの詳細だけ見る」形にする。
  function renderChargeRouteSelect(code, entry, dir){
    var items = chargeRoutesFor(code, dir);
    if(!items.length) return "";
    var field = dir === "in" ? "chargeInIdx" : "chargeOutIdx";
    var idx = entry[field];
    if(!(idx >= 0 && idx < items.length)) idx = 0;
    var label = dir === "in" ? "入口：ここへチャージできるカード" : "出口：ここからチャージできる先";
    return '' +
    '<div class="debit-calc" style="margin-top:8px">' +
      '<div class="debit-calc-row wrap"><span><b>' + label + '</b>(' + items.length + '件)</span>' +
        '<select data-charge-select data-code="' + code + '" data-kind="' + dir + '">' +
          items.map(function(r, i){
            var v = chargeView(r);
            var name = dir === "in" ? chargeNodeName(r.f) : chargeNodeName(r.t);
            return '<option value="' + i + '"' + (i === idx ? ' selected' : '') + '>' + CHARGE_ST[v.st].icon + ' ' + name + (v.pending ? '(' + v.pending.date.slice(5).replace("-","/") + '〜変更)' : '') + '</option>';
          }).join("") +
        '</select>' +
      '</div>' +
      renderChargeRouteDetail(items[idx], dir) +
    '</div>';
  }
  function renderChargeLegend(){
    return '<p class="route-legend">' + ["ok","zero","ng","unk"].map(function(k){ return CHARGE_ST[k].icon + CHARGE_ST[k].label; }).join("　") +
      '<br>公式で不可でも実際は通るルート、公式で対象でも急に封鎖されるルートがあるため、公式と実践報告を分けて載せています。「付与」はチャージ元カード側のポイントです。</p>';
  }
  // 銀行ページ用：その銀行のデビットカードからのチャージ先(出口)。
  function renderDebitRoutes(bank, entry){
    if(!CHARGE_DEBIT_NAME[bank.code]) return "";
    var sel = renderChargeRouteSelect(bank.code, entry, "out");
    if(!sel) return "";
    return '<div class="sect"><h3>デビットでのチャージ先(出口)</h3>' + sel + renderChargeLegend() + '</div>';
  }
  // チャージ経路：入口(ここへチャージできるカード)・出口(ここからチャージできる先)はCHARGE_ROUTESから、
  // 「その他のチャージ方法」(銀行口座・現金等)と「使える場所」(加盟店の種類)は各カードのcharge.from/toから出す。
  // (2026-09-24ユーザー決定：旧「出口」＝加盟店は「使える場所」として別枠に残し、出口はチャージ先のプリペイド・電子マネーにする)
  function renderCardCharge(card, entry){
    var inSel = renderChargeRouteSelect(card.code, entry, "in");
    var outSel = renderChargeRouteSelect(card.code, entry, "out");
    var routes = (inSel || outSel) ? inSel + outSel + renderChargeLegend() : "";
    var fromSel = (card.charge && card.kind === "prepaid") ? renderChargeSelect(card, entry, "from", card.charge.from, "その他のチャージ方法(公式)") : "";
    var toSel = (card.charge && card.kind === "prepaid") ? renderChargeSelect(card, entry, "to", card.charge.to, "使える場所") : "";
    var limits = card.limits ? '<p class="stat-note" style="padding:0">' + foldIfUncertain(card.limits) + '</p>' : "";
    if(!routes && !fromSel && !toSel && !limits) return "";
    return '<div class="sect"><h3>チャージ経路(入口／出口)' + srcMark(card,'charge') + '</h3>' + routes + fromSel + toSel + limits + '</div>';
  }

  /* ---------- 🎁ポイントタブ（POINT_DATA）の描画 ----------
     カタログUI・お気に入り♡・spec-row系のCSSは💳カード・📈証券と共用する。
     「ポイント交換(交換可否・交換比率)」は交換ルート選定の最重要判断材料のため、
     タグライン(pros[0])の直後・他のどのセクションよりも先に表示する(2026-09-04ユーザー要望)。 */
  // 交換レート(rate)が判明している行だけを対象に、保有ポイント数→交換後の数量を計算する電卓。
  // rateは各交換先ラベルの「このポイント→交換先」方向が明確なものだけに付与済み(片方向のみ判明・
  // レート不明・条件により変動する行などは意図的にrate無し=電卓の対象外としている)。
  // 全角の「、」「。」を、括弧の深さが0の位置でだけ区切り文字として使う分割(括弧内の読点で誤分割しないため)。
  function splitTopLevelJa(text){
    var parts = [], depth = 0, buf = "";
    for(var i = 0; i < text.length; i++){
      var ch = text[i];
      if(ch === "(" || ch === "（") depth++;
      else if(ch === ")" || ch === "）") depth = Math.max(0, depth - 1);
      if((ch === "、" || ch === "。") && depth === 0){
        if(buf.trim()) parts.push(buf.trim());
        buf = "";
      } else {
        buf += ch;
      }
    }
    if(buf.trim()) parts.push(buf.trim());
    return parts;
  }
  // 獲得方法(earnHow)の文章を、末尾の「(詳細)」を右列に分けた表に変換する。
  function renderEarnTable(text){
    if(!text) return "";
    var rows = splitTopLevelJa(text).map(function(p){
      var m = p.match(/^(.*?)([\(（][^()（）]*[\)）])$/);
      return m
        ? '<tr><td>' + m[1].trim() + '</td><td>' + m[2].trim() + '</td></tr>'
        : '<tr><td colspan="2">' + p + '</td></tr>';
    }).join("");
    return '<div class="pt-tlwrap"><table class="pt-tl"><tr><th>方法</th><th>詳細</th></tr>' + rows + '</table></div>';
  }
  // 見出しの正式名称末尾に付く「(運営会社名等)」の補足は、運営情報が本文側(pt.operator)に
  // 別途あるため見出しでは不要と判断し取り除く(2026-09-23ユーザー要望)。
  function stripNameParen(name){
    return (name || "").replace(/[（(][^（）()]*[）)]\s*$/, '').trim();
  }
  // 不確実性を示す表現の一覧(2026-09-23、「確度中」「未確認」以外にも「〜の可能性が高い」
  // 「見当たらず」等いろいろな言い回しがあると指摘されたため、複数箇所から参照する
  // 一箇所にまとめて拡充した)。
  var UNCERTAIN_PATTERN = /未確認|確度|要確認|情報相違|記載なし|確認できず|調査中|二次情報|一次情報|可能性が高い|可能性がある|不明|見当たらず|情報が乏しい/;
  // 調査時の裏取りメモ(「(公式確認)」「(確度高)」等、文末の出典確度に関する注記)は
  // 利用者に見せる必要がない社内向け情報のため、表示直前に取り除く(2026-09-21ユーザー要望)。
  function stripSourceNote(s){
    if(!s) return s;
    return s.replace(/[（(][^（）()]*(?:公式|確認|確度|二次情報|一次情報)[^（）()]*[）)]\s*$/, '').trim();
  }
  // 条件・補足は、確定情報でも自由記述の長文になりがちで一覧表の幅を圧迫するため、
  // 内容によらず一律で折りたたみに統一する(2026-09-21ユーザー要望。長文とリンクだけの
  // 行が混在して不揃いだったため統一)。出典確認の注記は基本的に取り除くが、
  // 「中〜高(エムアイカード公式は確認済み、はぴe側公式は未確認)」のように、
  // 注記を取り除くと肝心の中身がほぼ残らなくなる場合だけオリジナルのまま見せる。
  function foldNote(note){
    var original = note || "";
    if(!original) return "";
    var cleaned = stripSourceNote(original);
    var display = (cleaned && cleaned.length >= 6) ? cleaned : original;
    return '<details class="note-fold"><summary>詳細</summary>' + display + '</details>';
  }
  // クレジットカード・プリペイドの特典/チャージ元・先/上限は、テーブルと違い短い1行ずつの
  // 並びなので、上記のように毎回まるごと畳むと逆に読みにくい。「未確認」「確度中」等の
  // 不確実な注記を含む行だけ選んで畳む(2026-09-23ユーザー指摘。ポイント画面だけ対応していて
  // カード側のspecial/tsumitate/charge/limitsに同じ注記が生のまま残っていた)。
  function foldIfUncertain(note){
    var original = note || "";
    if(!original) return "";
    if(UNCERTAIN_PATTERN.test(original)){
      return '<details class="note-fold" style="display:inline-block"><summary>詳細(確度に注意)</summary>' + original + '</details>';
    }
    return stripSourceNote(original);
  }
  // 電卓の「この交換先の条件」表示。上記と同じ理由で一律で折りたたむ。
  function renderCalcCondition(note){
    var folded = foldNote(note);
    if(!folded) return "";
    return folded.replace('<summary>詳細</summary>', '<summary>📌 この交換先の条件</summary>').replace('class="note-fold"', 'class="note-fold calc-condition"');
  }
  // 「可否・レート」列(value)にも「・レート未確認」等が混ざることがあるため、
  // 「可」自体は常に見せたまま、それ以降の不確実な部分だけ畳む(2026-09-21ユーザー要望)。
  function renderExchangeValue(value){
    var cleaned = stripSourceNote(value);
    if(UNCERTAIN_PATTERN.test(cleaned)){
      var head = cleaned.match(/^可[^・]*/);
      var headText = head ? head[0] : "可";
      var rest = cleaned.slice(headText.length);
      return headText + '<details class="note-fold" style="display:inline-block"><summary>詳細</summary>' + rest + '</details>';
    }
    return cleaned;
  }
  // 🔄ポイント交換の一覧を表(交換先/可否・レート/条件・補足)にする。
  // 交換不可・対象外・不明・直接ルートなし等(valueが「可」で始まらないもの)は、
  // 一覧に載らないこと自体で「交換できない」と伝わるため表示しない(2026-09-21ユーザー要望)。
  function renderExchangeTable(rows){
    var visible = rows.filter(function(r){ return /^可/.test(r.value); });
    // 還元率(rate)の高い順に並べる(2026-09-23ユーザー要望)。rate未設定(レート未確認等)は末尾へ。
    visible = visible.slice().sort(function(a, b){
      var ar = typeof a.rate === "number" ? a.rate : -Infinity;
      var br = typeof b.rate === "number" ? b.rate : -Infinity;
      return br - ar;
    });
    var body = visible.map(function(r){
      return '<tr><td>' + r.label + '</td><td>' + renderExchangeValue(r.value) + '</td><td>' + foldNote(r.note) + '</td></tr>';
    }).join("");
    return '<div class="pt-tlwrap"><table class="pt-tl"><tr><th>交換先</th><th>可否・レート</th><th>条件・補足</th></tr>' + body + '</table></div>';
  }
  // 直接の交換ルートがなく別のポイントを中継する必要がある組み合わせを、経路図として見せる。
  // (2026-09-13ユーザー要望。現時点でmyCoin→エムアイポイント→ANA/JALマイルのみ具体的な数値が判明しているため対象)
  function renderRouteDiagram(pt){
    if(!pt.multiHopRoutes || !pt.multiHopRoutes.length) return "";
    var chains = pt.multiHopRoutes.map(function(r){
      var html = '<div class="route-box">' + r.steps[0] + '</div>';
      for(var i = 1; i < r.steps.length; i++){
        html += '<div class="route-arrow">→<b>' + r.rates[i-1] + '</b></div>' + '<div class="route-box">' + r.steps[i] + '</div>';
      }
      return '<div class="route-diagram">' + html + '</div>';
    }).join("");
    // 電卓は常に見せたまま、これは付随情報として畳む(2026-09-23ユーザー要望、1画面に収めるため)。
    return '<details class="sect exchange-table-fold"><summary>🗺️ 中継が必要な交換ルート</summary>' + chains +
      '<p class="stat-note">直接の交換ルートがないため、間に別のポイントを経由する必要があります。</p></details>';
  }
  function renderPointCalc(pt, entry){
    var opts = [];
    (pt.exchanges || []).forEach(function(e, i){
      if(typeof e.rate === "number") opts.push({e:e, i:i});
    });
    // 交換表と同じく還元率の高い順に並べる(2026-09-23ユーザー要望)。
    opts.sort(function(a, b){ return b.e.rate - a.e.rate; });
    if(!opts.length) return "";
    var targetIdx = opts.some(function(o){ return o.i === entry.calcTarget; }) ? entry.calcTarget : opts[0].i;
    var chosen = pt.exchanges[targetIdx];
    var ratePct = Math.round(chosen.rate * 1000) / 10;
    // ポイント数を未入力の間は、取得済みの保有残高を初期値として使う(表示・計算の両方に反映させる)
    var amountDisplay = entry.calcAmount ? entry.calcAmount : (entry.balance ? entry.balance.pt : '');
    var amount = Number(amountDisplay) || 0;
    var resultVal = Math.round(amount * chosen.rate);
    // 交換先を選んだ直後に還元率・最低交換単位等の条件をまず見せ、
    // その上でポイント数を入力してもらう順番にする(2026-09-21ユーザー要望)。
    return '' +
    '<div class="debit-calc" style="margin-top:8px">' +
      '<div class="debit-calc-row wrap"><span>交換先</span>' +
        '<select data-calc-target data-code="' + pt.code + '">' +
          opts.map(function(o){ return '<option value="' + o.i + '"' + (o.i === targetIdx ? ' selected' : '') + '>' + o.e.label + '</option>'; }).join("") +
        '</select>' +
      '</div>' +
      '<div class="debit-calc-row"><span>還元率</span><b>' + ratePct + '%</b></div>' +
      renderCalcCondition(chosen.note) +
      '<div class="debit-calc-row"><span>ポイント数</span><span>' +
        '<input type="number" inputmode="decimal" min="0" step="1" data-calc-amount data-code="' + pt.code + '" value="' + amountDisplay + '" placeholder="0">' +
      '</span></div>' +
      '<div class="debit-calc-result">交換後：<b>' + resultVal.toLocaleString() + '</b>' + chosen.unit + '</div>' +
    '</div>';
  }

  function simCurrentTier(code, amount){

  }
  function simNextTier(code, amount){
    var tiers = SIM_TIERS[code];
    for(var i=0;i<tiers.length;i++){

    }
    return null;

  function computeRequiredFundsList(){
    var list = [];
    DATA.forEach(function(bank){
      var entry = getEntry(bank.code);
      (bank.pointItems || []).forEach(function(item, idx){
        // furikomi(定額自動振込)・received(被振込の振込元設定)は、実際にお金が動く連携設定(送金元/送金先・金額)が入力済みであれば、
        // ポイント獲得チェック(entry.pts)の有無に関係なく必ず必要資金として計上する(チェックはポイント集計用、必要資金は「実際に動くお金」を見るための別の指標のため)
        if(item.schedule && item.schedule.kind === "furikomi"){
          var selF = entry.sched[idx];
          if(!selF || !selF.day || !selF.amount) return;
          var targetBank = selF.targetCode ? DATA.filter(function(b){ return b.code === selF.targetCode; })[0] : null;
          list.push({
            bankName: bank.name + (targetBank ? " → " + targetBank.name : ""),
            label: item.label,
            amount: selF.amount,
            schedule: computeScheduleDates(item, selF)
          });
          return;
        }
        if(item.schedule && item.schedule.kind === "received"){
          getScheduleRows(entry, idx).forEach(function(row){
            if(!row.sourceCode) return;
            var srcBank = DATA.filter(function(b){ return b.code === row.sourceCode; })[0];
            var amount = row.amount || item.reqAmount;
            var count = row.count || 1;
            var schedResult = row.day ? {stages:[{label:"振込予定日", date:nextMonthlyDate(row.day)}]} : null;
            list.push({
              bankName: (srcBank ? srcBank.name + " → " : "") + bank.name,
              label: item.label + "(" + formatYen(amount) + "×" + count + "回)",
              amount: scheduleRowTotal(row, item),
              schedule: schedResult
            });
          });
          return;
        }
        // furikomi/received以外(nyukin型・スケジュールなしの固定額項目)は、これまで通りポイント獲得チェックがONの項目だけを計上する
        if(!item.reqAmount || !entry.pts[idx]) return;
        var sel = entry.sched[idx];
        var schedResult2 = item.schedule ? computeScheduleDates(item, sel) : null;
        list.push({bankName: bank.name, label: item.label, amount: item.reqAmount, schedule: schedResult2});
      });
    });
    return list;
  }

  function render(){

  // カード内の入力操作(select/inputの変更、ボタン押下)は要素ごとinnerHTMLで作り直されるため、
  // data-*属性の組み合わせで同一要素を再特定し、フォーカス・カーソル位置を復元する
  function describeFocus(el){
    if(!el || !el.tagName || !els.pages.contains(el)) return null;
    // selectはchange直後に.focus()すると一部ブラウザ(特にスマホ)でプルダウンが再び開いてしまうため対象外にする
    if(el.tagName === "SELECT") return null;
    // 数値/テキスト系inputもchange(=入力確定・blur)後に.focus()すると、スマホでの自動ズームが戻らず拡大されたままになるため対象外にする(チェックボックスは対象外の副作用がないため復元を残す)
    if(el.tagName === "INPUT" && el.type !== "checkbox") return null;
    var attrs = Array.prototype.filter.call(el.attributes, function(a){ return a.name.indexOf("data-") === 0; });
    if(!attrs.length) return null;
    var esc = function(v){ return v.replace(/["\\]/g, "\\$&"); };
    var selector = el.tagName.toLowerCase() + attrs.map(function(a){
      return "[" + a.name + '="' + esc(a.value) + '"]';
    }).join("");
    if(el.type === "radio"){
      selector += '[value="' + esc(el.value) + '"]';
    }
    var info = {selector: selector};
    if(typeof el.selectionStart === "number"){
      info.selStart = el.selectionStart;
      info.selEnd = el.selectionEnd;
    }
    return info;
  }
  function restoreFocus(info){
    if(!info) return;
    var el;
    try{ el = els.pages.querySelector(info.selector); }catch(e){ return; }
    if(!el) return;
    el.focus({preventScroll:true});
    if(info.selStart != null && typeof el.setSelectionRange === "function"){
      try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
    }
  }

    if(e.key !== "Enter" && e.key !== " ") return;
    var stageBtn = e.target.closest("[data-stage-btn]");
    if(stageBtn){ e.preventDefault(); setStage(stageBtn.dataset.code, parseInt(stageBtn.dataset.idx, 10)); render(); }
  });

  function goToIndex(i, direction){
    if(currentList.length === 0) return;
    var n = currentList.length;
    var wrapped = ((i % n) + n) % n;
    if(direction === undefined) direction = wrapped > currentIndex ? 1 : (wrapped < currentIndex ? -1 : 0);
    currentIndex = wrapped;
    renderTabs();
    renderCurrentPage(direction, true);
  }
  els.tabStrip.addEventListener("click", function(e){
    var tab = e.target.closest("[data-tab-idx]");
    if(tab) goToIndex(parseInt(tab.dataset.tabIdx, 10));
  });

  // スマホでの横スワイプによる前後移動(指の動きにカードを追従させる)
  var touchStartX = 0, touchStartY = 0, dragDX = 0, dragDirDecided = false, dragIsHorizontal = false, dragCard = null;

  els.pages.addEventListener("touchstart", function(e){
    var t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    dragDX = 0; dragDirDecided = false; dragIsHorizontal = false;
    // セレクト・入力欄・ボタン・折りたたみ・リンクの操作中は横スワイプ判定をしない
    // (2026-09-23、電卓や詳細を触ると画面がフラフラ動く不具合の修正。指のわずかな
    // ブレを横スワイプと誤判定してカード全体がズレていた)。
    var interactive = e.target.closest("select, input, button, summary, a, textarea");
    dragCard = interactive ? null : els.pages.querySelector(".page-card");
  }, {passive:true});

  els.pages.addEventListener("touchmove", function(e){
    if(!dragCard) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if(!dragDirDecided){
      if(Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
      dragDirDecided = true;
      dragIsHorizontal = Math.abs(dx) > Math.abs(dy) * 1.5;
      if(dragIsHorizontal) dragCard.style.transition = "none";
    }
    if(!dragIsHorizontal) return;
    e.preventDefault();
    dragDX = dx;
    dragCard.style.transform = "translateX(" + dx + "px)";
  }, {passive:false});

  els.pages.addEventListener("touchend", function(){
    if(!dragCard){ return; }
    if(dragDirDecided && dragIsHorizontal){
      var threshold = 60;
      dragCard.style.transition = "transform .22s ease, opacity .22s ease";
      if(Math.abs(dragDX) > threshold && currentList.length > 1){
        var goingNext = dragDX < 0;
        var targetIndex = currentIndex + (goingNext ? 1 : -1);
        var flyTo = goingNext ? -(window.innerWidth) : window.innerWidth;
        dragCard.style.transform = "translateX(" + flyTo + "px)";
        dragCard.style.opacity = "0";
        setTimeout(function(){ goToIndex(targetIndex, goingNext ? 1 : -1); }, 200);
      } else {
        dragCard.style.transform = "translateX(0)";
      }
    }
    dragCard = null; dragDirDecided = false; dragIsHorizontal = false;
  }, {passive:true});

  

  /* ==================== 🔗 外部(iPhoneショートカット)からのポイント残高取り込み ここから ====================
     マネーフォワードMEの「ポイント」グループ画面からショートカットで抽出した
     [{n:サービス名, p:"1,234ポイント", y:"1,234円", c:連携元カード名}, ...] を
     URLパラメータ(?mfdata=...)で受け取り、localStorageに保存する(2026-09-14実装)。
     サービス名だけでは判別できない項目(汎用の「ポイント」表記など)は連携元カード名の
     キーワードで判定する。ここに載っていないサービスは黙って無視するので、
     対応を増やしたい時はMF_POINT_MAPに1行足すだけでよい。 */
  var MF_POINT_MAP = [
    {code:"PT13", test:function(name){ return name.indexOf("永久不滅ポイント") !== -1; }},
    {code:"PT17", test:function(name){ return name.indexOf("JREポイント") !== -1; }},
    {code:"PT08", test:function(name){ return name.indexOf("ANAマイレージ") !== -1 || name.indexOf("ANAマイル") !== -1; }},
    {code:"PT01", test:function(name, cardName){ return name === "ポイント" && cardName.indexOf("JCB") !== -1; }},
    {code:"PT06", test:function(name, cardName){ return name === "ポイント" && cardName.indexOf("三井住友") !== -1; }}
  ];
  function resolveMfCode(name, cardName){
    for(var i = 0; i < MF_POINT_MAP.length; i++){
      if(MF_POINT_MAP[i].test(name || "", cardName || "")) return MF_POINT_MAP[i].code;
    }
    return null;
  }
  function parseAmountText(text){
    var m = (text || "").match(/[0-9,]+/);
    return m ? parseInt(m[0].replace(/,/g, ""), 10) : null;
  }
  // "1,234ポイント"/"3,000マイル"のような文字列から、数字を除いた単位部分(ポイント/マイル等)だけを取り出す
  function parseUnitText(text){
    var u = (text || "").replace(/[0-9,，\s]/g, "").trim();
    return u || "pt";
  }
  function applyExternalPointData(){
    var raw;
    try{
      raw = new URLSearchParams(location.search).get("mfdata");
    }catch(e){ return; }
    if(!raw) return;
    var items = null;
    // URLSearchParams.get()の時点でパーセントエンコードは既に復元済みなので、ここでdecodeURIComponentは不要(二重デコード防止)
    try{ items = JSON.parse(raw); }catch(e){ items = null; }
    if(Array.isArray(items)){
      var totals = {};
      items.forEach(function(it){
        var code = resolveMfCode(it.n, it.c);
        if(!code) return;
        var pt = parseAmountText(it.p);
        if(pt === null) return;
        var yen = parseAmountText(it.y);
        if(!totals[code]) totals[code] = {pt:0, yen:0, unit: parseUnitText(it.p)};
        totals[code].pt += pt;
        totals[code].yen += (yen || 0);
      });
      var codes = Object.keys(totals);
      codes.forEach(function(code){
        var entry = getEntry(code);
        entry.balance = {pt: totals[code].pt, unit: totals[code].unit, yen: totals[code].yen, updatedAt: stampNow(), source: "マネーフォワードME"};
      });
      if(codes.length > 0){
        saveState();
        setTimeout(function(){ alert("マネーフォワードMEから " + codes.length + "件のポイント残高を反映しました。"); }, 300);
      }
    }
    history.replaceState(null, "", location.pathname + location.hash);
  }
  /* ==================== 🔗 外部からのポイント残高取り込み ここまで ==================== */

  renderCollectionSwitch();
  applyCollectionVisibility();
  touchDiag();   // 起動のたびに「このコードを見た」記録を残す（保存テスト用）
  applyExternalPointData();
  render();
})();
</script>
<script>
/* 🐾 足跡（訪問カウント、GoatCounter・クッキー不使用）
   - 公開ページ（hamutamako.github.io）で開かれたときだけ数える。
     ローカルやテストサーバー（127.0.0.1・Tailscale経由）ではそもそも読み込まない。
   - 家族の端末は一度 https://hamutamako.github.io/#notrack を開けば
     以後その端末はカウントされない（localStorageに除外フラグを保存） */
(function(){
  try{
    if(location.hash.indexOf("notrack") >= 0){
      localStorage.setItem("noTrack.v1", "1");
    }
    if(location.hostname !== "hamutamako.github.io") return;
    if(localStorage.getItem("noTrack.v1")) return;
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://gc.zgo.at/count.js";
    s.dataset.goatcounter = "https://hamutamako.goatcounter.com/count";
    document.head.appendChild(s);
  }catch(e){}
})();
</script>
