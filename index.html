    SIM_BANK_CODES.forEach(function(code){ sum += (simState.alloc[code] || 0); });
    return sum;
  }
  function computeRequiredFundsList(){
    var list = [];
    DATA.forEach(function(bank){
      var entry = getEntry(bank.code);
      (bank.pointItems || []).forEach(function(item, idx){
        // furikomi(定額自動振込)・received(被振込の振込元設定)は、実際にお金が動く連携設定(送金元/送金先・金額)が入力済みであれば、
        // ポイント獲得チェック(entry.pts)の有無に関係なく必ず必要資金として計上する(チェックはポイント集計用、必要資金は「実際に動くお金」を見るための別の指標のため)
        if(item.schedule && item.schedule.kind === "furikomi"){
          var selF = entry.sched[idx];
          if(!selF || !selF.day || !selF.amount) return;
          var targetBank = selF.targetCode ? DATA.filter(function(b){ return b.code === selF.targetCode; })[0] : null;
          list.push({
            bankName: bank.name + (targetBank ? " → " + targetBank.name : ""),
            label: item.label,
            amount: selF.amount,
            schedule: computeScheduleDates(item, selF)
          });
          return;
        }
        if(item.schedule && item.schedule.kind === "received"){
          getScheduleRows(entry, idx).forEach(function(row){
            if(!row.sourceCode) return;
            var srcBank = DATA.filter(function(b){ return b.code === row.sourceCode; })[0];
            var amount = row.amount || item.reqAmount;
            var count = row.count || 1;
            var schedResult = row.day ? {stages:[{label:"振込予定日", date:nextMonthlyDate(row.day)}]} : null;
            list.push({
              bankName: (srcBank ? srcBank.name + " → " : "") + bank.name,
              label: item.label + "(" + formatYen(amount) + "×" + count + "回)",
              amount: scheduleRowTotal(row, item),
              schedule: schedResult
            });
          });
          return;
        }
        // furikomi/received以外(nyukin型・スケジュールなしの固定額項目)は、これまで通りポイント獲得チェックがONの項目だけを計上する
        if(!item.reqAmount || !entry.pts[idx]) return;
        var sel = entry.sched[idx];
        var schedResult2 = item.schedule ? computeScheduleDates(item, sel) : null;
        list.push({bankName: bank.name, label: item.label, amount: item.reqAmount, schedule: schedResult2});
      });
    });
    return list;
  }
  function renderSim(){
    var banksHtml = SIM_BANK_CODES.map(function(code){
      var bank = DATA.filter(function(b){ return b.code === code; })[0];
      var logo = LOGO[code];
      var amount = simState.alloc[code] || 0;
      var tiers = SIM_TIERS[code];
      var maxSlider = Math.round(tiers[tiers.length-1].min * 1.2) || 1000000;
      var tier = simCurrentTier(code, amount);
      var next = simNextTier(code, amount);
      var nextHtml = next
        ? '次の「<b>' + next.name + '</b>」まであと <b>' + formatYen(next.min - amount) + '</b>'
        : '最上位ランク到達中🎉';
      return '' +
        '<div class="sim-bank" data-code="' + code + '">' +
          '<div class="sim-bank-head">' +
            '<div class="sim-bank-badge" style="background:' + logo.color + ';">' + logo.label + '</div>' +
            '<div class="sim-bank-name">' + bank.name + '</div>' +
            '<div class="sim-bank-tier">' + tier.name + '</div>' +
          '</div>' +
          '<input class="sim-slider" type="range" min="0" max="' + maxSlider + '" step="10000" value="' + amount + '" data-sim-code="' + code + '">' +
          '<div class="sim-amount-row"><span>配分額</span><span class="sim-amount-val">' + formatYen(amount) + '</span></div>' +
          '<div class="sim-next">' + nextHtml + '</div>' +
        '</div>';
    }).join("");

    var remain = (simState.total || 0) - simAllocSum();
    var over = remain < 0;

    var reqList = computeRequiredFundsList();
    var reqTotal = reqList.reduce(function(s, r){ return s + r.amount; }, 0);
    var reqHtml = reqList.length
      ? '<div class="sim-req-box">' +
          '<div class="sim-req-title">🧾 チェック済み条件から今すぐ必要な資金</div>' +
          '<div class="sim-req-total">合計 <b>' + formatYen(reqTotal) + '</b></div>' +
          '<ul class="sim-req-list">' + reqList.map(function(r){
            var schedHtml = r.schedule
              ? '<div class="sched-timeline">' + r.schedule.stages.map(function(s, i){
                  return (i > 0 ? '<span class="sched-arrow">→</span>' : '') +
                    '<span class="sched-dot"></span><span class="sched-stage-label">' + s.label + ' ' + formatDate(s.date) + '</span>';
                }).join("") + '</div>'
              : '';
            return '<li class="sim-req-item">' +
              '<div class="sim-req-item-row"><span>' + r.bankName + ' — ' + r.label + '</span><span class="sim-req-item-amt">' + formatYen(r.amount) + '</span></div>' +
              schedHtml +
            '</li>';
          }).join("") + '</ul>' +
        '</div>'
      : '';

    els.simView.innerHTML = '' +
      reqHtml +
      '<div class="sim-total">' +
        '<span class="sim-total-label">💰 今動かせる合計金額</span>' +
        '<input class="sim-total-input" type="number" inputmode="decimal" step="10000" id="simTotalInput" value="' + (simState.total || "") + '" placeholder="0">' +
      '</div>' +
      '<div class="sim-remain' + (over ? ' over' : '') + '">' +
        (over ? ('⚠ ' + formatYen(-remain) + ' 足りません。配分を見直してください') : ('残り配分可能額：' + formatYen(remain))) +
      '</div>' +
      banksHtml +
      '<button class="sim-reset" id="simResetBtn" type="button">配分をリセット</button>';
  }
  function updateSimBankRow(code){
    var row = els.simView.querySelector('.sim-bank[data-code="' + code + '"]');
    if(!row) return;
    var amount = simState.alloc[code] || 0;
    var tier = simCurrentTier(code, amount);
    var next = simNextTier(code, amount);
    row.querySelector(".sim-bank-tier").textContent = tier.name;
    row.querySelector(".sim-amount-val").textContent = formatYen(amount);
    row.querySelector(".sim-next").innerHTML = next
      ? ('次の「<b>' + next.name + '</b>」まであと <b>' + formatYen(next.min - amount) + '</b>')
      : "最上位ランク到達中🎉";
  }
  function updateSimRemain(){
    var remain = (simState.total || 0) - simAllocSum();
    var over = remain < 0;
    var el = els.simView.querySelector(".sim-remain");
    if(!el) return;
    el.classList.toggle("over", over);
    el.textContent = over ? ("⚠ " + formatYen(-remain) + " 足りません。配分を見直してください") : ("残り配分可能額：" + formatYen(remain));
  }

  function renderPointsSummary(){
    // 「★選択中ポイント合計」バーは2026-07-30のユーザー要望で削除(表示が変だったため)。
    // 復活させる場合はgit履歴のこの関数と#pointsSummary要素・CSSを戻す。
  }

  function render(){
    var focusInfo = describeFocus(document.activeElement);
    var q = els.search.value;
    var keepCode = currentList[currentIndex] ? currentList[currentIndex].code : null;

    var isCardColl = activeCollection === "card";
    var isStockColl = activeCollection === "stock";
    var source = isCardColl ? CARD_DATA : isStockColl ? STOCK_DATA : DATA;
    var list = source.filter(function(b){
      return matchesSearch(b,q) && ((isCardColl || isStockColl) ? passesCardFilters(b) : passesFilters(b));
    });
    if((isCardColl || isStockColl) && currentSort && currentSort !== "rate" && currentSort !== "code"){
      // カード・証券のデータには銀行用のソート項目（デビット・振込回数・獲得pt）が無い。
      // それらが選ばれていても並べ替えず元の順のままにする。
    } else if(currentSort === "rate"){
      list = list.slice().sort(function(a,b){ return b.rateMax - a.rateMax; });
    } else if(currentSort === "debit"){
      list = list.slice().sort(function(a,b){ return debitRateSortValue(b) - debitRateSortValue(a); });
    } else if(currentSort === "freeTransfer"){
      list = list.slice().sort(function(a,b){ return b.freeTransferMax - a.freeTransferMax; });
    } else if(currentSort === "points"){
      list = list.slice().sort(function(a,b){ return pointTotalSortValue(b) - pointTotalSortValue(a); });
    } else if(currentSort === "code"){
      list = list.slice().sort(function(a,b){ return a.code < b.code ? -1 : a.code > b.code ? 1 : 0; });
    }
    currentList = list;

    var keptIdx = keepCode ? currentList.findIndex(function(b){ return b.code === keepCode; }) : -1;
    var cardChanged = keptIdx === -1;
    currentIndex = keptIdx !== -1 ? keptIdx : 0;

    var ownedTotal = source.filter(function(b){ return getEntry(b.code).owned; }).length;
    els.ownedCount.textContent = ownedTotal;
    els.totalCount.textContent = source.length;
    renderPointsSummary();

    renderTabs();
    renderCurrentPage(undefined, cardChanged);
    restoreFocus(focusInfo);
  }
  // カード内の入力操作(select/inputの変更、ボタン押下)は要素ごとinnerHTMLで作り直されるため、
  // data-*属性の組み合わせで同一要素を再特定し、フォーカス・カーソル位置を復元する
  function describeFocus(el){
    if(!el || !el.tagName || !els.pages.contains(el)) return null;
    // selectはchange直後に.focus()すると一部ブラウザ(特にスマホ)でプルダウンが再び開いてしまうため対象外にする
    if(el.tagName === "SELECT") return null;
    // 数値/テキスト系inputもchange(=入力確定・blur)後に.focus()すると、スマホでの自動ズームが戻らず拡大されたままになるため対象外にする(チェックボックスは対象外の副作用がないため復元を残す)
    if(el.tagName === "INPUT" && el.type !== "checkbox") return null;
    var attrs = Array.prototype.filter.call(el.attributes, function(a){ return a.name.indexOf("data-") === 0; });
    if(!attrs.length) return null;
    var esc = function(v){ return v.replace(/["\\]/g, "\\$&"); };
    var selector = el.tagName.toLowerCase() + attrs.map(function(a){
      return "[" + a.name + '="' + esc(a.value) + '"]';
    }).join("");
    if(el.type === "radio"){
      selector += '[value="' + esc(el.value) + '"]';
    }
    var info = {selector: selector};
    if(typeof el.selectionStart === "number"){
      info.selStart = el.selectionStart;
      info.selEnd = el.selectionEnd;
    }
    return info;
  }
  function restoreFocus(info){
    if(!info) return;
    var el;
    try{ el = els.pages.querySelector(info.selector); }catch(e){ return; }
    if(!el) return;
    el.focus({preventScroll:true});
    if(info.selStart != null && typeof el.setSelectionRange === "function"){
      try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
    }
  }

  function toggleOwned(code){
    var entry = getEntry(code);
    entry.owned = !entry.owned;
    saveState();
  }
  function setStage(code, idx){
    var entry = getEntry(code);
    entry.stage = (entry.stage === idx) ? null : idx;
    saveState();
  }

  els.pages.addEventListener("click", function(e){
    var jumpSrc = e.target.closest("[data-jump-src]");
    if(jumpSrc){
      var targetEl = document.getElementById(jumpSrc.dataset.jumpSrc);
      if(targetEl){
        targetEl.scrollIntoView({behavior:"smooth", block:"center"});
        targetEl.classList.remove("src-highlight");
        void targetEl.offsetWidth;
        targetEl.classList.add("src-highlight");
        setTimeout(function(){ targetEl.classList.remove("src-highlight"); }, 2200);
      }
      return;
    }
    var ownedBtn = e.target.closest("[data-owned-btn]");
    if(ownedBtn){
      toggleOwned(ownedBtn.dataset.code);
      render();
      return;
    }
    var stageBtn = e.target.closest("[data-stage-btn]");
    if(stageBtn){
      setStage(stageBtn.dataset.code, parseInt(stageBtn.dataset.idx, 10));
      render();
      return;
    }
    var mrowAdd = e.target.closest("[data-mrow-add]");
    if(mrowAdd){
      addScheduleRow(mrowAdd.dataset.code, parseInt(mrowAdd.dataset.idx, 10));
      render();
      return;
    }
    var mrowRemove = e.target.closest("[data-mrow-remove]");
    if(mrowRemove){
      removeScheduleRow(mrowRemove.dataset.code, parseInt(mrowRemove.dataset.idx, 10), parseInt(mrowRemove.dataset.row, 10));
      render();
    }
  });
  els.pages.addEventListener("change", function(e){
    var pointBox = e.target.closest("[data-point-toggle]");
    if(pointBox){
      togglePointItem(pointBox.dataset.code, parseInt(pointBox.dataset.idx, 10));
      render();
      return;
    }
    var spendInput = e.target.closest("[data-debit-spend]");
    if(spendInput){
      setDebitSpend(spendInput.dataset.code, spendInput.value);
      render();
      return;
    }
    var rateInput = e.target.closest("[data-debit-rate]");
    if(rateInput){
      setDebitRate(rateInput.dataset.code, rateInput.value);
      render();
      return;
    }
    var schedDay = e.target.closest("[data-sched-day]");
    if(schedDay){
      setItemSchedule(schedDay.dataset.code, parseInt(schedDay.dataset.idx, 10), {day: parseInt(schedDay.value, 10)});
      render();
      return;
    }
    var schedFreeday = e.target.closest("[data-sched-freeday]");
    if(schedFreeday){
      var n = parseInt(schedFreeday.value, 10);
      var day = (isFinite(n) && n >= 1 && n <= 31) ? n : null;
      setItemSchedule(schedFreeday.dataset.code, parseInt(schedFreeday.dataset.idx, 10), {day: day});
      render();
      return;
    }
    var schedHoliday = e.target.closest("[data-sched-holiday]");
    if(schedHoliday){
      setItemSchedule(schedHoliday.dataset.code, parseInt(schedHoliday.dataset.idx, 10), {holiday: schedHoliday.value});
      render();
      return;
    }
    var schedSource = e.target.closest("[data-sched-source]");
    if(schedSource){
      setItemSchedule(schedSource.dataset.code, parseInt(schedSource.dataset.idx, 10), {sourceCode: schedSource.value || null});
      render();
      return;
    }
    var schedTarget = e.target.closest("[data-sched-target]");
    if(schedTarget){
      setItemSchedule(schedTarget.dataset.code, parseInt(schedTarget.dataset.idx, 10), {targetCode: schedTarget.value || null});
      render();
      return;
    }
    var schedAmount = e.target.closest("[data-sched-amount]");
    if(schedAmount){
      var samt = parseInt(schedAmount.value, 10);
      setItemSchedule(schedAmount.dataset.code, parseInt(schedAmount.dataset.idx, 10), {amount: (isFinite(samt) && samt >= 0) ? samt : null});
      render();
      return;
    }
    var mrowSource = e.target.closest("[data-mrow-source]");
    if(mrowSource){
      setScheduleRowField(mrowSource.dataset.code, parseInt(mrowSource.dataset.idx, 10), parseInt(mrowSource.dataset.row, 10), {sourceCode: mrowSource.value || null});
      render();
      return;
    }
    var mrowAmount = e.target.closest("[data-mrow-amount]");
    if(mrowAmount){
      var mamt = parseInt(mrowAmount.value, 10);
      setScheduleRowField(mrowAmount.dataset.code, parseInt(mrowAmount.dataset.idx, 10), parseInt(mrowAmount.dataset.row, 10), {amount: (isFinite(mamt) && mamt >= 0) ? mamt : null});
      render();
      return;
    }
    var mrowCount = e.target.closest("[data-mrow-count]");
    if(mrowCount){
      var mcnt = parseInt(mrowCount.value, 10);
      setScheduleRowField(mrowCount.dataset.code, parseInt(mrowCount.dataset.idx, 10), parseInt(mrowCount.dataset.row, 10), {count: (isFinite(mcnt) && mcnt >= 1) ? mcnt : 1});
      render();
      return;
    }
    var mrowDay = e.target.closest("[data-mrow-day]");
    if(mrowDay){
      var mday = parseInt(mrowDay.value, 10);
      setScheduleRowField(mrowDay.dataset.code, parseInt(mrowDay.dataset.idx, 10), parseInt(mrowDay.dataset.row, 10), {day: (isFinite(mday) && mday >= 1 && mday <= 31) ? mday : null});
      render();
    }
  });
  els.pages.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var stageBtn = e.target.closest("[data-stage-btn]");
    if(stageBtn){ e.preventDefault(); setStage(stageBtn.dataset.code, parseInt(stageBtn.dataset.idx, 10)); render(); }
  });

  function goToIndex(i, direction){
    if(currentList.length === 0) return;
    var n = currentList.length;
    var wrapped = ((i % n) + n) % n;
    if(direction === undefined) direction = wrapped > currentIndex ? 1 : (wrapped < currentIndex ? -1 : 0);
    currentIndex = wrapped;
    renderTabs();
    renderCurrentPage(direction, true);
  }
  els.tabStrip.addEventListener("click", function(e){
    var tab = e.target.closest("[data-tab-idx]");
    if(tab) goToIndex(parseInt(tab.dataset.tabIdx, 10));
  });

  // スマホでの横スワイプによる前後移動(指の動きにカードを追従させる)
  var touchStartX = 0, touchStartY = 0, dragDX = 0, dragDirDecided = false, dragIsHorizontal = false, dragCard = null;

  els.pages.addEventListener("touchstart", function(e){
    var t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    dragDX = 0; dragDirDecided = false; dragIsHorizontal = false;
    dragCard = els.pages.querySelector(".page-card");
  }, {passive:true});

  els.pages.addEventListener("touchmove", function(e){
    if(!dragCard) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if(!dragDirDecided){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      dragDirDecided = true;
      dragIsHorizontal = Math.abs(dx) > Math.abs(dy);
      if(dragIsHorizontal) dragCard.style.transition = "none";
    }
    if(!dragIsHorizontal) return;
    e.preventDefault();
    dragDX = dx;
    dragCard.style.transform = "translateX(" + dx + "px)";
  }, {passive:false});

  els.pages.addEventListener("touchend", function(){
    if(!dragCard){ return; }
    if(dragDirDecided && dragIsHorizontal){
      var threshold = 60;
      dragCard.style.transition = "transform .22s ease, opacity .22s ease";
      if(Math.abs(dragDX) > threshold && currentList.length > 1){
        var goingNext = dragDX < 0;
        var targetIndex = currentIndex + (goingNext ? 1 : -1);
        var flyTo = goingNext ? -(window.innerWidth) : window.innerWidth;
        dragCard.style.transform = "translateX(" + flyTo + "px)";
        dragCard.style.opacity = "0";
        setTimeout(function(){ goToIndex(targetIndex, goingNext ? 1 : -1); }, 200);
      } else {
        dragCard.style.transform = "translateX(0)";
      }
    }
    dragCard = null; dragDirDecided = false; dragIsHorizontal = false;
  }, {passive:true});

  

  renderCollectionSwitch();
  applyCollectionVisibility();
  touchDiag();   // 起動のたびに「このコードを見た」記録を残す（保存テスト用）
  render();
})();
</script>
<script>
/* 🐾 足跡（訪問カウント、GoatCounter・クッキー不使用）
   - 公開ページ（hamutamako.github.io）で開かれたときだけ数える。
     ローカルやテストサーバー（127.0.0.1・Tailscale経由）ではそもそも読み込まない。
   - 家族の端末は一度 https://hamutamako.github.io/#notrack を開けば
     以後その端末はカウントされない（localStorageに除外フラグを保存） */
(function(){
  try{
    if(location.hash.indexOf("notrack") >= 0){
      localStorage.setItem("noTrack.v1", "1");
    }
    if(location.hostname !== "hamutamako.github.io") return;
    if(localStorage.getItem("noTrack.v1")) return;
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://gc.zgo.at/count.js";
    s.dataset.goatcounter = "https://hamutamako.goatcounter.com/count";
    document.head.appendChild(s);
  }catch(e){}
})();
</script>
